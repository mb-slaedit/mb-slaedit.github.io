name: Refresh Instagram Token

on:
  schedule:
    # Toda segunda-feira às 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: # Permite execução manual

permissions:
  contents: write # Para commitar o token atualizado

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh Instagram Token
        env:
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
        run: node scripts/refresh-ig-token.js

      - name: Commit updated token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/ig-token.json
          git diff --staged --quiet || git commit -m "chore: refresh Instagram token [skip ci]"
          git push